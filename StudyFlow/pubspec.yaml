name: studyflow
description: Multiplatform study and productivity app with local AI integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  http: ^1.2.1

  google_fonts: ^6.2.1

  file_picker: ^8.0.5
  syncfusion_flutter_pdf: ^33.2.5

  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
