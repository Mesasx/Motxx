<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <script>try{if(localStorage.getItem("motex-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#080F0C"/>
  <title>Curso | Motex Campus</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="canonical" href="https://aimotex.com/campus/curso/"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="stylesheet" href="/campus/campus.css"/>
</head>
<body class="campus-app" data-active="cursos">
<header class="app-topbar">
  <a class="brand" href="/campus/panel/">Mot<span class="logo-ex">ex</span> <span class="campus-badge">Campus</span></a>
  <span class="spacer"></span>
  <a href="/campus/panel/" class="btn btn-ghost" style="padding:8px 14px">← Mi panel</a>
  <a href="/campus/perfil/" class="avatar" id="topAvatar" aria-label="Mi perfil"></a>
</header>
<main class="section" style="padding-top:34px">
  <div class="container">
    <div id="courseHead" style="margin:0 0 24px">
      <p class="eyebrow" id="courseLevel"></p>
      <h1 id="courseTitle" style="font-size:1.9rem">Cargando…</h1>
      <p id="courseDesc" style="color:var(--text-secondary)"></p>
      <div id="courseProgress" style="max-width:420px;margin-top:14px" hidden>
        <div class="progress-row"><span id="progLabel">0/0 clases</span><span id="progPct">0%</span></div>
        <div class="progress"><span id="progBar" style="width:0%"></span></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1.35fr 0.65fr;gap:30px;align-items:start" class="course-grid">
      <div id="stage"></div>
      <aside>
        <h2 style="font-size:1.15rem;margin-bottom:14px">Temario</h2>
        <ul class="lesson-list" id="lessonList"></ul>
      </aside>
    </div>
  </div>
</main>

<div class="pay-cta-bar" id="payBar" hidden>
  <p><strong id="payBarText">Desbloquea el curso completo.</strong></p>
  <a class="btn btn-primary" id="payBarBtn" href="#">Pagar ahora</a>
</div>

<style>@media (max-width: 820px){ .course-grid{ grid-template-columns:1fr !important; } }</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/campus/config.js"></script>
<script src="/campus/lib/app.js"></script>
<script>
(async function () {
  if (!MC.configured) {
    document.getElementById("stage").innerHTML = '<div class="locked-panel">' + MC.notConfiguredMessage() + "</div>";
    return;
  }
  var session = await MC.requireAuth();
  if (!session) return;
  var me = await MC.getProfile();
  MC.fillAvatar(document.getElementById("topAvatar"), me);
  var wmText = (me && (me.email || me.username)) || session.user.email || "Motex Campus";

  // Disuasores anti-copia: sin clic derecho ni arrastre sobre el reproductor.
  document.addEventListener("contextmenu", function (e) { if (e.target.closest(".player")) e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { if (e.target.closest(".player")) e.preventDefault(); });

  var wmTimer = null;
  function startWatermark() {
    if (wmTimer) clearInterval(wmTimer);
    var move = function () {
      var el = document.getElementById("wm"); if (!el) return;
      el.style.top = (8 + Math.random() * 78) + "%";
      el.style.left = (6 + Math.random() * 58) + "%";
    };
    move(); wmTimer = setInterval(move, 4000);
  }

  var slug = MC.qs("slug") || "iniciacion";
  var cRes = await MC.client.from("courses").select("*").eq("slug", slug).maybeSingle();
  var course = cRes.data;
  if (!course) { document.getElementById("courseTitle").textContent = "Curso no encontrado"; return; }

  document.getElementById("courseLevel").textContent = course.subtitle || course.level || "";
  document.getElementById("courseTitle").textContent = course.title;
  document.getElementById("courseDesc").textContent = course.description || "";

  var enr = await MC.client.from("enrollments").select("status").eq("course_id", course.id).eq("status", "active").maybeSingle();
  var staff = await MC.isStaff();
  var owned = !!enr.data || staff;
  var done = await MC.completedLessonIds();

  var catRes = await MC.client.from("lessons_catalog").select("*").eq("course_id", course.id).order("sort_order");
  var catalog = catRes.data || [];
  var listEl = document.getElementById("lessonList");
  var currentId = MC.qs("lesson");

  function accessible(l) { return owned || l.is_free; }

  if (!currentId) {
    var firstOpen = catalog.find(function (l) { return accessible(l) && !done.has(l.id); })
                 || catalog.find(accessible) || catalog[0];
    currentId = firstOpen ? firstOpen.id : null;
  }

  function renderTemario() {
    listEl.innerHTML = catalog.map(function (l, i) {
      var open = accessible(l);
      var isDone = done.has(l.id);
      var tag = open
        ? (isDone ? '<span class="tag" style="color:var(--success)">✓</span>' : (l.is_free && !owned ? '<span class="tag free">Gratis</span>' : ""))
        : '<span class="tag locked">🔒</span>';
      var attrs = open ? ' data-id="' + l.id + '"' : "";
      return (
        '<li class="lesson-item' + (open ? "" : " locked") + (isDone ? " done" : "") + (l.id === currentId ? " active" : "") + '"' + attrs + ' style="cursor:' + (open ? "pointer" : "default") + '">' +
          '<span class="idx">' + (isDone ? "✓" : (i + 1)) + "</span>" +
          '<span class="body"><h3>' + MC.esc(l.title) + "</h3><p>" + MC.esc(l.summary || "") + (l.duration_min ? " · " + l.duration_min + " min" : "") + "</p></span>" +
          tag +
        "</li>"
      );
    }).join("");
  }

  function updateProgress() {
    if (!owned && !catalog.some(function (l) { return l.is_free; })) return;
    var total = catalog.length || 1;
    var completed = catalog.filter(function (l) { return done.has(l.id); }).length;
    var pct = Math.round((completed / total) * 100);
    document.getElementById("courseProgress").hidden = !owned;
    document.getElementById("progLabel").textContent = completed + "/" + catalog.length + " clases";
    document.getElementById("progPct").textContent = pct + "%";
    document.getElementById("progBar").style.width = pct + "%";
  }

  async function renderExercise(lessonId) {
    var exRes = await MC.client.from("exercises").select("*").eq("lesson_id", lessonId).order("sort_order");
    var exs = exRes.data || [];
    if (!exs.length) return "";
    var ex = exs[0];
    var subRes = await MC.client.from("exercise_submissions").select("*").eq("exercise_id", ex.id).maybeSingle();
    var sub = subRes.data;
    return (
      '<div class="exercise-box" data-ex="' + ex.id + '">' +
        '<p class="eyebrow" style="color:var(--accent)">Ejercicio práctico</p>' +
        "<h3>" + MC.esc(ex.title) + "</h3>" +
        '<p style="color:var(--text-secondary);margin-bottom:12px">' + MC.esc(ex.prompt) + "</p>" +
        '<textarea id="exAnswer" rows="4" placeholder="Escribe tu respuesta…">' + MC.esc(sub ? sub.answer : "") + "</textarea>" +
        '<div class="form-msg ok" id="exOk" hidden style="margin-top:10px">¡Ejercicio guardado! Lo verás en «Mis ejercicios».</div>' +
        '<button class="btn btn-primary" id="exBtn" style="margin-top:12px">' + (sub ? "Actualizar respuesta" : "Entregar ejercicio") + "</button>" +
      "</div>"
    );
  }

  async function openLesson(id) {
    var stage = document.getElementById("stage");
    var meta = catalog.find(function (l) { return l.id === id; });
    if (!meta) return;
    if (!accessible(meta)) { renderLocked(); return; }

    var lRes = await MC.client.from("lessons").select("*").eq("id", id).maybeSingle();
    var lesson = lRes.data;
    if (!lesson) { renderLocked(); return; }

    var embed = MC.safeEmbed(lesson.video_url);
    var wm = '<span class="watermark" id="wm">' + MC.esc(wmText) + "</span>";
    var player = embed
      ? '<div class="player">' + wm + '<iframe src="' + MC.esc(embed) + '" allowfullscreen></iframe></div>'
      : '<div class="player">' + wm + '<div style="display:grid;place-items:center;height:100%;color:var(--text-muted)">Vídeo de la clase (pendiente de subir)</div></div>';

    var isDone = done.has(id);
    var exHtml = await renderExercise(id);

    stage.innerHTML =
      player +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap">' +
        "<h2 style=\"margin:0\">" + MC.esc(lesson.title) + "</h2>" +
        '<button class="btn ' + (isDone ? "btn-secondary" : "btn-primary") + '" id="completeBtn">' + (isDone ? "✓ Completada" : "Marcar como completada") + "</button>" +
      "</div>" +
      '<p style="color:var(--text-secondary)">' + MC.esc(lesson.content || lesson.summary || "") + "</p>" +
      exHtml;

    startWatermark();

    listEl.querySelectorAll(".lesson-item").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-id") === id);
    });

    document.getElementById("completeBtn").addEventListener("click", async function () {
      this.disabled = true;
      await MC.markComplete(id, course.id);
      done.add(id);
      renderTemario(); updateProgress();
      this.disabled = false; this.className = "btn btn-secondary"; this.textContent = "✓ Completada";
    });

    var exBtn = document.getElementById("exBtn");
    if (exBtn) exBtn.addEventListener("click", async function () {
      var box = document.querySelector(".exercise-box");
      var exId = box.getAttribute("data-ex");
      var answer = document.getElementById("exAnswer").value.trim();
      if (!answer) return;
      this.disabled = true; this.textContent = "Guardando…";
      var r = await MC.client.from("exercise_submissions").upsert(
        { user_id: session.user.id, exercise_id: exId, answer: answer, status: "submitted" },
        { onConflict: "user_id,exercise_id" }
      );
      if (!r.error) { document.getElementById("exOk").hidden = false; }
      this.disabled = false; this.textContent = "Actualizar respuesta";
    });
  }

  function renderLocked() {
    document.getElementById("stage").innerHTML =
      '<div class="locked-panel">' +
        '<p class="campus-badge">Contenido bloqueado</p>' +
        '<h2 style="margin:14px 0 8px">Compra el curso para ver esta clase</h2>' +
        '<p style="color:var(--text-secondary);max-width:480px;margin:0 auto 22px">Tienes acceso gratuito a la primera clase. Desbloquea el resto del temario con un único pago.</p>' +
        '<a class="btn btn-primary" href="/campus/pago/?slug=' + slug + '">Pagar ' + MC.formatPrice(course.price_cents, course.currency) + "</a>" +
      "</div>";
  }

  listEl.addEventListener("click", function (e) {
    var li = e.target.closest(".lesson-item[data-id]");
    if (li) openLesson(li.getAttribute("data-id"));
  });

  renderTemario();
  updateProgress();
  if (currentId) openLesson(currentId); else renderLocked();

  if (!owned) {
    var bar = document.getElementById("payBar");
    document.getElementById("payBarText").textContent =
      "Desbloquea «" + course.title + "» — " + MC.formatPrice(course.price_cents, course.currency);
    document.getElementById("payBarBtn").href = "/campus/pago/?slug=" + slug;
    bar.hidden = false;
  }
})();
</script>
</body>
</html>
