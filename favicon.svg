<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Motex">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD7C5"/>
      <stop offset="0.55" stop-color="#46D7E0"/>
      <stop offset="1" stop-color="#8AA0FF"/>
    </linearGradient>
  </defs>
  <!-- Cuadro oscuro con borde sutil de gradiente (tema oscuro) -->
  <rect width="128" height="128" rx="28" fill="#0B1712"/>
  <rect x="7" y="7" width="114" height="114" rx="23" fill="#111E18" stroke="url(#g)" stroke-width="2" opacity="0.9"/>
  <!-- ex en cursiva -->
  <text x="64" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" font-weight="700" fill="url(#g)">ex</text>
  <!-- subrayado -->
  <rect x="40" y="92" width="48" height="6" rx="3" fill="url(#g)"/>
</svg>
